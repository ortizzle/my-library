<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#452a0f"/>
      <stop offset="52%" stop-color="#2a1808"/>
      <stop offset="100%" stop-color="#150a03"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8b84a" stop-opacity=".30"/>
      <stop offset="55%" stop-color="#c8912e" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#c8912e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f9f3e0"/>
      <stop offset="72%" stop-color="#efe3c4"/>
      <stop offset="100%" stop-color="#d3bc8e"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#f9f3e0"/>
      <stop offset="72%" stop-color="#efe3c4"/>
      <stop offset="100%" stop-color="#d3bc8e"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#82293b"/>
      <stop offset="100%" stop-color="#4e1520"/>
    </linearGradient>
    <linearGradient id="gutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b4a24" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5a3a18" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#6b4a24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" fill="url(#bg)"/>

  <g transform="matrix(.84 0 0 .84 14.4 14.4)">
    <!-- lamplight -->
    <circle cx="90" cy="94" r="68" fill="url(#glow)"/>

    <!-- ornament -->
    <g stroke="#d4a030" stroke-width=".9" opacity=".85">
      <path d="M60,30 H82" stroke-linecap="round"/>
      <path d="M98,30 H120" stroke-linecap="round"/>
    </g>
    <path d="M90,25.5 L94.5,30 L90,34.5 L85.5,30 Z" fill="#d4a030"/>

    <g transform="translate(90,100)">
      <!-- ribbon bookmark -->
      <path d="M-3.4,36 L-3.4,60 L0,53 L3.4,60 L3.4,36 Z" fill="#8b2242"/>
      <path d="M-3.4,36 L-3.4,60 L0,53 L0,36 Z" fill="#6e2233"/>

      <!-- leather cover -->
      <path d="M-2,-42 L-54,-46.5 C-60,-46.5 -63.5,-42.5 -63.5,-36.5 L-63.5,32.5 C-63.5,38.5 -60,42.5 -54,42.5 L-2,47 Z" fill="url(#leather)" stroke="#d4a030" stroke-width="1.3"/>
      <path d="M2,-42 L54,-46.5 C60,-46.5 63.5,-42.5 63.5,-36.5 L63.5,32.5 C63.5,38.5 60,42.5 54,42.5 L2,47 Z" fill="url(#leather)" stroke="#d4a030" stroke-width="1.3"/>
      <path d="M-2,-42 Q0,-43.5 2,-42 L2,47 Q0,48.5 -2,47 Z" fill="#3d101a"/>

      <!-- page block edges -->
      <path d="M0,-31 C-14,-38 -36,-40 -52,-35 L-52,37 C-36,32 -14,34 0,43 Z" fill="#cdb383"/>
      <path d="M0,-31 C14,-38 36,-40 52,-35 L52,37 C36,32 14,34 0,43 Z" fill="#cdb383"/>
      <path d="M0,-33.5 C-14,-40.5 -36,-42.5 -52,-37.5 L-52,34.5 C-36,29.5 -14,31.5 0,40.5 Z" fill="#e4d5ae"/>
      <path d="M0,-33.5 C14,-40.5 36,-42.5 52,-37.5 L52,34.5 C36,29.5 14,31.5 0,40.5 Z" fill="#e4d5ae"/>

      <!-- open pages -->
      <path d="M0,-36 C-14,-43 -36,-45 -52,-40 L-52,32 C-36,27 -14,29 0,38 Z" fill="url(#pageL)"/>
      <path d="M0,-36 C14,-43 36,-45 52,-40 L52,32 C36,27 14,29 0,38 Z" fill="url(#pageR)"/>

      <!-- gutter shading -->
      <path d="M-11,-38 C-4,-41 4,-41 11,-38 L11,36 C4,32.5 -4,32.5 -11,36 Z" fill="url(#gutter)"/>
      <path d="M0,-36 L0,38" stroke="#8a6a44" stroke-width="1" opacity=".55"/>

      <!-- page top highlights -->
      <path d="M0,-36 C-14,-43 -36,-45 -52,-40" fill="none" stroke="#fffbe9" stroke-width="1.1" opacity=".5"/>
      <path d="M0,-36 C14,-43 36,-45 52,-40" fill="none" stroke="#fffbe9" stroke-width="1.1" opacity=".5"/>

      <!-- text lines -->
      <g stroke="#a8895f" stroke-width="2" stroke-linecap="round" fill="none" opacity=".85">
        <path d="M-45,-22 Q-26,-26 -9,-21.5"/>
        <path d="M-45,-12 Q-26,-16 -9,-11.5"/>
        <path d="M-45,-2 Q-26,-6 -9,-1.5"/>
        <path d="M-45,8 Q-26,4 -9,8.5"/>
        <path d="M-45,18 Q-26,14 -9,18.5"/>
        <path d="M45,-22 Q26,-26 9,-21.5"/>
        <path d="M45,-12 Q26,-16 9,-11.5"/>
        <path d="M45,-2 Q26,-6 9,-1.5"/>
        <path d="M45,8 Q26,4 9,8.5"/>
        <path d="M45,18 Q26,14 9,18.5"/>
      </g>
    </g>
  </g>
</svg>
